name = "form-at-admin"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "form-at-analytics"
database_id = "d2e6f2f0-b4cd-40c0-98b3-04c060ecbffa"

# These are the LIVE values, not a template — `verifyAccessJwt.ts` checks
# incoming tokens against them, so editing either one to a placeholder locks
# every mutating admin endpoint out.
#
# Non-secret, safe to commit and safe in a public repo. The AUD tag only
# identifies which Access Application a JWT was issued for; it doesn't let
# anyone forge a signature (that still requires Cloudflare's own private
# signing key, which never leaves Cloudflare).
#
# Where to re-read them if the Access application is ever recreated:
# TEAM_DOMAIN: Zero Trust → Settings → Custom Pages (or the URL your team
# login page uses) — https://<team-name>.cloudflareaccess.com.
# AUD: Zero Trust → Access → Applications → (the admin.formatglasgow.com
# app) → Overview tab → "Application Audience (AUD) Tag".
[vars]
CF_ACCESS_TEAM_DOMAIN = "https://holy-pine-0064.cloudflareaccess.com"
CF_ACCESS_AUD = "6844a056d71815043f047d8132dcc15d4e62aff500338aa60188f89c235ff377"

# Zone id for formatglasgow.com. Non-secret for the same reason as the AUD tag
# above: it's a public identifier, not a credential — reading analytics with it
# still requires CF_ANALYTICS_TOKEN, which IS a Pages secret and is never
# committed. Storing this as a secret would imply it needs protecting.
# Where to re-read it: the zone's Overview tab → API → Zone ID.
CF_ZONE_ID = "559d86b5a76e8415f83d4c3e0832935c"

# Account id, and the Web Analytics site tag for formatglasgow.com. Non-secret
# for the same reason as CF_ZONE_ID: the site tag is literally published in the
# beacon snippet on every page of the public site, and the account id is
# published in every R2 endpoint URL — treating either as a secret would
# protect nothing and imply otherwise.
#
# CF_ACCOUNT_ID replaces the R2_ACCOUNT_ID Pages secret, which held this same
# value under an R2-flavoured name. sets-presign.ts still falls back to the old
# name; delete that fallback and the secret once this is confirmed live.
# Where to re-read them: account id on any zone's Overview tab -> API; site tag
# under Analytics & Logs -> Web Analytics -> formatglasgow.com (same value as
# the `token` in the injected beacon).
CF_ACCOUNT_ID = "REPLACE_WITH_ACCOUNT_ID"
CF_RUM_SITE_TAG = "REPLACE_WITH_WEB_ANALYTICS_SITE_TAG"
