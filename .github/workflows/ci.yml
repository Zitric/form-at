name: CI

on:
  push:
    branches-ignore: [main] # main pushes go to deploy.yml after a PR has been merged
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  # ── Static analysis: biome lint + format + tsc type check ────────────────
  static:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is gitignored — vite generates it on dev/build start.
      # We need it on disk before tsc can resolve `./routeTree.gen` in router.tsx.
      - run: pnpm -C apps/web exec vite build
      - run: pnpm -C apps/admin exec vite build
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/admin lint
      - run: pnpm -C packages/ui lint
      - run: pnpm -C packages/data lint
      - run: pnpm -C apps/rum-archiver lint
      # turbo tsc covers every workspace (apps/web, apps/admin, packages/ui,
      # packages/data) in one task graph.
      - run: pnpm turbo tsc

  # ── Unused files/deps/exports (knip) ─────────────────────────────────────
  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is gitignored — knip traces `router.tsx`'s import of
      # it just like tsc does (same reason the `static` job builds first);
      # without this, knip reports an "Unresolved imports" false failure on
      # every fresh checkout. Both apps' route trees are needed, since knip
      # scans the whole workspace in one pass.
      - run: pnpm -C apps/web exec vite build
      - run: pnpm -C apps/admin exec vite build
      - run: pnpm knip

  # ── Unit tests (vitest, jsdom) ───────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web test:run
      - run: pnpm -C apps/admin test:run
      - run: pnpm --filter @form-at/ui test
      - run: pnpm --filter @form-at/data test
      - run: pnpm -C apps/rum-archiver test:run

  # ── Chromatic (Storybook visual regression) ──────────────────────────────
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Chromatic needs full git history to diff against baseline
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Playwright browser involved — Chromatic renders in its own cloud
      # browsers, so this cannot collide with the e2e job's browser cache key.
      - uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook

  # ── E2E tests (playwright, chromium + webkit) ─────────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Key includes the browser set AND the lockfile hash. Browser set:
          # deploy.yml caches chromium-only under this same path, so sharing a
          # key lets its cache poison this job — webkit missing, and the install
          # skipped on cache-hit. Lockfile: the ^-versioned @playwright/test can
          # bump its required browser build via pnpm-lock without package.json
          # changing.
          key: pw-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}

      # Both install steps below retry up to 3x with a 5-minute cap per
      # attempt: GitHub's runners are fresh VMs every run, so `install-deps`'
      # apt-get call happens on EVERY run regardless of the browser cache
      # above (that cache only restores ~/.cache/ms-playwright's binaries,
      # never the OS's apt state) — and it hits `azure.archive.ubuntu.com`,
      # a regional mirror observed hanging for 45+ minutes rather than
      # falling back to the canonical archive promptly. `timeout` kills a
      # stuck attempt so the next one gets a fresh connection instead of
      # grinding on a bad mirror for the whole job; `timeout-minutes` below
      # is the outer bound in case all three attempts are still slow.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          success=false
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if timeout 300 pnpm -C apps/web exec playwright install --with-deps chromium webkit; then
              success=true
              break
            fi
            echo "Attempt $i failed or timed out after 5m (likely a slow apt mirror) — retrying..."
            sleep 10
          done
          $success || exit 1

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 20
        run: |
          success=false
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if timeout 300 pnpm -C apps/web exec playwright install-deps chromium webkit; then
              success=true
              break
            fi
            echo "Attempt $i failed or timed out after 5m (likely a slow apt mirror) — retrying..."
            sleep 10
          done
          $success || exit 1

      - name: Run Playwright tests (apps/web)
        run: pnpm -C apps/web test:e2e --project=chromium --project=webkit

      # Same job, same cache — apps/admin's playwright.config.ts uses the
      # same chromium+webkit projects already installed above, on a distinct
      # port (5174) so it can't collide with apps/web's dev server.
      - name: Run Playwright tests (apps/admin)
        run: pnpm -C apps/admin test:e2e --project=chromium --project=webkit

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/admin/playwright-report/
          retention-days: 7
