name: CI

on:
  push:
    branches-ignore: [main] # main pushes go to deploy.yml after a PR has been merged
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  # ── Static analysis: biome lint + format + tsc type check ────────────────
  static:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is gitignored — vite generates it on dev/build start.
      # We need it on disk before tsc can resolve `./routeTree.gen` in router.tsx.
      - run: pnpm -C apps/web exec vite build
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web tsc

  # ── Unused files/deps/exports (knip) ─────────────────────────────────────
  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is gitignored — knip traces `router.tsx`'s import of
      # it just like tsc does (same reason the `static` job builds first);
      # without this, knip reports an "Unresolved imports" false failure on
      # every fresh checkout (verified locally, 2026-07-22).
      - run: pnpm -C apps/web exec vite build
      - run: pnpm knip

  # ── Unit tests (vitest, jsdom) ───────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web test:run

  # ── E2E tests (playwright, chromium + webkit) ─────────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Key includes the browser set AND the lockfile hash. Browser set:
          # deploy.yml caches chromium-only under this same path — sharing a
          # key let its cache poison this job's (webkit missing, install
          # skipped on cache-hit; bit us on PR #2, 2026-07-02). Lockfile:
          # the ^-versioned @playwright/test can bump its required browser
          # build via pnpm-lock without package.json changing.
          key: pw-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -C apps/web exec playwright install --with-deps chromium webkit

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium webkit

      - name: Run Playwright tests
        run: pnpm -C apps/web test:e2e --project=chromium --project=webkit

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
