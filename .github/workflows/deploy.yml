name: Deploy

on:
  push:
    branches: [main]
  # Manual trigger for redeploying a commit that's already on main — a merge
  # whose push event never produced a run (GitHub Actions outages drop them),
  # or a re-deploy after a Cloudflare-side failure. Without this, the only way
  # to ship an already-merged commit is to invent another commit. Runs the same
  # gated jobs as the push path; it skips no checks.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  # Run the full test matrix before deploying so a direct push to main can't
  # ship broken code. PRs run the same checks via ci.yml.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # routeTree.gen.ts is gitignored — vite generates it on dev/build start.
      - run: pnpm -C apps/web exec vite build
      - run: pnpm -C apps/admin exec vite build
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/admin lint
      - run: pnpm -C packages/ui lint
      - run: pnpm -C packages/data lint
      - run: pnpm turbo tsc

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web test:run
      - run: pnpm -C apps/admin test:run
      - run: pnpm --filter @form-at/ui test
      - run: pnpm --filter @form-at/data test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Chromium-only key — MUST stay distinct from ci.yml's
          # chromium-webkit key: the caches share a path, keys are
          # first-writer-wins, and this job installing fewer browsers under a
          # shared key poisons ci.yml's webkit run.
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      # Both install steps below retry up to 3x with a 5-minute cap per
      # attempt: GitHub's runners are fresh VMs every run, so `install-deps`'
      # apt-get call happens on EVERY run regardless of the browser cache
      # above (that cache only restores ~/.cache/ms-playwright's binaries,
      # never the OS's apt state) — and it hits `azure.archive.ubuntu.com`,
      # a regional mirror observed hanging for 45+ minutes rather than
      # falling back to the canonical archive promptly. `timeout` kills a
      # stuck attempt so the next one gets a fresh connection instead of
      # grinding on a bad mirror for the whole job; `timeout-minutes` below
      # is the outer bound in case all three attempts are still slow.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          success=false
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if timeout 300 pnpm -C apps/web exec playwright install --with-deps chromium; then
              success=true
              break
            fi
            echo "Attempt $i failed or timed out after 5m (likely a slow apt mirror) — retrying..."
            sleep 10
          done
          $success || exit 1
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 20
        run: |
          success=false
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if timeout 300 pnpm -C apps/web exec playwright install-deps chromium; then
              success=true
              break
            fi
            echo "Attempt $i failed or timed out after 5m (likely a slow apt mirror) — retrying..."
            sleep 10
          done
          $success || exit 1
      - run: pnpm -C apps/web test:e2e --project=chromium
      # Same job, same chromium-only cache above.
      - run: pnpm -C apps/admin test:e2e --project=chromium

  deploy:
    needs: [static, unit, e2e]
    runs-on: ubuntu-latest
    # Job-level (not step-level) — `pnpm build` now runs `generate-sets-snapshot`
    # (packages/data/src/sets.generated.ts, regenerated fresh from the live
    # `sets` D1 table right before this build), which needs these credentials
    # just as much as the wrangler deploy step after it does. Previously these
    # were scoped only to the deploy step, since nothing before it touched
    # Cloudflare — that's no longer true.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx wrangler pages deploy apps/web/dist/client --project-name=form-at-web --branch=main

  # Separate Cloudflare Pages project, separate job — independent build
  # output and failure isolation from the apps/web deploy above (one failing
  # doesn't block or conflate with the other), and they run in parallel.
  deploy-admin:
    needs: [static, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/admin build
      - run: npx wrangler pages deploy dist/client --project-name=form-at-admin --branch=main
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The RUM archiver is a standalone Worker, not a Pages project — Pages
  # Functions cannot run cron (no scheduled handler exists), which is why this
  # is a third deploy target. `wrangler deploy` registers the cron trigger
  # declared in its wrangler.toml alongside the code.
  deploy-rum-archiver:
    needs: [static, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx wrangler deploy
        working-directory: apps/rum-archiver
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
